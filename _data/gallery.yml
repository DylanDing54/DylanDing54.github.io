# Projects shown in the Gallery section on the front page.
#
# Each entry renders as a title, a row of photos, then a description.
#
#   title:       heading for the entry
#   images:      list of photos, each with a filename in /images/gallery/
#                (or a full https:// URL) and an `alt` description
#   description: paragraph shown under the photos
#
# Images are shown at roughly 300-450px wide, so 800-1200px on the long
# edge is plenty. Anything larger just slows the page down.

- title: "A 22nm RISC-V SoC Chip System for Speech Keyword Spotting Task Demonstration"
  images:
    - image: "kws-chip-die.jpg"
      alt: "Annotated die photograph of the 22nm keyword spotting SoC"
    - image: "kws-pcb-bringup.jpg"
      alt: "Custom PCB test setup for post-silicon validation of the SoC"
  description: >-
    I carried the demo chip development through the entire design flow:
    architecture definition, algorithm model training and quantization, RTL
    implementation, embedding system development, FPGA verification, and
    front-end-to-back-end physical design for tape-out at a 22nm technology
    node, custom PCB integration, post-silicon bring-up, ultimately achieving
    a real-time end-to-end Keyword Spotting (KWS) demo.
